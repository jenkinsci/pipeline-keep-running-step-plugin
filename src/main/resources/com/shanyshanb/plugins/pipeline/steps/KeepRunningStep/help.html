<p>
    Keep the process running even if the build has finished.
</p>
<p>
    <strong>Example:</strong><br/>
    <code><pre>
node {
    keepRunning {
        sh '/usr/local/apache-tomcat/bin/startup.sh'
    }
}
	</pre></code>
</p>
<p>
    This step requires a workspace and a task listener, so it must be used inside a
    <code>node</code> block, just like the <code>sh</code> step it wraps.
</p>
